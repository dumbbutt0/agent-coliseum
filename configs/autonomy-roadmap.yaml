# First Gladiator roadmap — DRAFT machine twin of FIRST-GLADIATOR-ROADMAP.md.
# Lands at repo configs/autonomy-roadmap.yaml in the M1 canonicalization
# commit; the OWNER activates it at SC-4 (until then the live roadmap at
# Claude-Wiki/coliseum/autonomy-roadmap.yaml, milestone society-substrate,
# remains authoritative). Strict YAML subset (tools/autonomy/roadmap.py):
# 2-space indents, block sequences, scalars, [] for empty lists, full-line
# comments only. Limits are stricter than or equal to policy caps. The
# Markdown roadmap and this file must agree exactly; divergence is a defect.
