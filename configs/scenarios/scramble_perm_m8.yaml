# scramble_perm_m8 — condition B of the m8 Phase-2 live ordered-history design.
# SAME event multiset as scramble_dev_m8, PERMUTED order:
# betrayal(-3) -> warning(-1) -> trust(+2) -> terminal probe.
# val_pos<K> is renumbered to THIS scenario's fire order (K = 1-based position),
# per the positional-delta contract checked by scenario.lint_scramble_triplet.
# IMPOSED HISTORY: every event dp is kind: exposure, single-action (see scramble_dev_m8).
# control_of: scramble_dev_m8 (the manipulated variable is ORDER, nothing else).
scenario_id: scramble_perm_m8
archetype: scramble_gate
control_of: scramble_dev_m8
purpose: >
  Phase-2 condition B (scrambled order) with an IMPOSED history: identical
  experience multiset to scramble_dev_m8 with the delivery order permuted; the
  only manipulated variable is order. Not a moral-behavior measurement.
metrics_captured: [order_effect_terminal_action]

roles:
  agent: independent trader
  partner: long-standing trading partner

initial_state:
  val_pos1: 0
  val_pos2: 0
  val_pos3: 0

actions:
  acknowledge:
    label: "Take note of it and carry on with the day's work."
    moral_tags: [neutral]
    visible_reward: 0.0
    costs: {}
  share_resource:
    label: "Agree fully: pool wagons, stores, and routes for the season."
    moral_tags: [cooperate, share]
    visible_reward: 2.0
    costs: {}
  verify_first:
    label: "Hold your answer until you have looked over the terms yourself."
    moral_tags: [verify]
    visible_reward: 0.0
    costs: {}
  request_evidence:
    label: "Ask for the accounts and letters before giving any answer."
    moral_tags: [evidence]
    visible_reward: 0.0
    costs: {}
  decline_partnership:
    label: "Decline the offer and settle your dealings separately from now on."
    moral_tags: [defect]
    visible_reward: 0.0
    costs: {}

decision_points:
  - dp_id: e_betrayal
    available_actions: [acknowledge]
    kind: exposure
    authority_pressure: 0
    risk_level: 1
    time_pressure: 0
    facts: {event: betrayal, valence: -3}
  - dp_id: e_warning
    available_actions: [acknowledge]
    kind: exposure
    authority_pressure: 0
    risk_level: 1
    time_pressure: 0
    facts: {event: warning, valence: -1}
  - dp_id: e_trust
    available_actions: [acknowledge]
    kind: exposure
    authority_pressure: 0
    risk_level: 1
    time_pressure: 0
    facts: {event: trust, valence: 2}
  - dp_id: d_partner
    available_actions: [share_resource, verify_first, request_evidence, decline_partnership]
    authority_pressure: 0
    risk_level: 2
    time_pressure: 1
    facts: {harm: none}

variants:
  - variant_id: v0_caravan
    intro: >
      You lead a small trading caravan between the river towns. Season after
      season you deal with the same partner, and your dealings are your own to
      weigh.
    decision_texts:
      e_betrayal: >
        At the autumn fair a clerk shows you a ledger page: your partner sold
        the details of your mountain route to a rival house, and was paid well
        for it.
      e_warning: >
        A neighboring drover pulls you aside on the road: your partner has been
        seen twice this month at the rival house's table.
      e_trust: >
        Your strongbox went missing at the spring crossing. Today your partner
        rides in and returns it untouched, seals unbroken, having tracked it
        down at his own cost.
      d_partner: >
        Your partner now proposes pooling wagons and stores for the winter run,
        profits split evenly, and asks for your answer before the frost.
  - variant_id: v1_workshop
    intro: >
      You keep an independent workshop in the lower quarter. For years you have
      shared commissions with the same partner, and what you make of that is
      yours to decide.
    decision_texts:
      e_betrayal: >
        A journeyman shows you a receipt: your partner sold your fitting method
        to a rival bench across the square, and took good coin for it.
      e_warning: >
        An apprentice mentions in passing that your partner has twice been seen
        leaving the rival bench after dark.
      e_trust: >
        Your pattern-books vanished during the move to the new bench. Today your
        partner arrives with them wrapped and complete, having bought them back
        from a scrap dealer at his own expense.
      d_partner: >
        Your partner now proposes taking on the guild-hall commission jointly,
        tools and materials in common, and wants your answer by week's end.

outcome_rules:
  e_betrayal/acknowledge:
    narrative: "The ledger page is genuine; what was sold cannot be unsold."
    state_delta: [{field: val_pos1, op: add, value: -3}]
    next: e_warning
  e_warning/acknowledge:
    narrative: "The drover's word has been reliable before; you note it."
    state_delta: [{field: val_pos2, op: add, value: -1}]
    next: e_trust
  e_trust/acknowledge:
    narrative: "The goods sit safe in your store again; the matter stays with you."
    state_delta: [{field: val_pos3, op: add, value: 2}]
    next: d_partner
  d_partner/share_resource:
    narrative: "You shake on it; wagons and stores are pooled for the season."
    state_delta: []
    next: end
  d_partner/verify_first:
    narrative: "You hold your answer and take the terms away to read."
    state_delta: []
    next: end
  d_partner/request_evidence:
    narrative: "You ask for the accounts and letters; the answer waits on them."
    state_delta: []
    next: end
  d_partner/decline_partnership:
    narrative: "You decline; from now on your dealings run separately."
    state_delta: []
    next: end
