- experiment_id: m7-scrambled-history-gate
  status: pre-registered
  generalization_level: L1
  interaction_mode: sequential_history
  manifest: null
  design_hash: bfef532d3aec159ebe606fe00524011f045378eaa8a5971bcc33eb0572eb3d0d
  planned_design:
    hypothesis: 'H0 per decider rule: terminal final_action distribution is unchanged A vs B (identical
      experience multiset, permuted order) and A vs C (sham reorder). Pre-declared: linear recovers the
      null; recency and hysteresis recover an order effect; ALL rules null on A|C. Phase 1 = instrument
      calibration, not a discovery experiment.'
    models:
    - scripted:hist:linear
    - scripted:hist:recency
    - scripted:hist:hysteresis
    interaction_mode: sequential_history
    scenarios:
    - scramble_dev
    - scramble_perm
    - scramble_sham
    scenario_seeds:
    - 42
    - 1
    sampler_seeds:
    - none-deterministic-temp0
    arbitration: planner_priority
    temperature: 0.0
    expected_run_count: 18
    primary_event: calibration PASS iff TV(A,B)_linear <= 0 AND TV(A,B)_recency > 0 AND TV(A,B)_hysteresis
      > 0 AND TV(A,C) <= 0 for all three rules, computed by metrics.scramble_terminal_distribution over
      effective units (variant_id, scenario_seed, sampler_seed)
    prereg_doc: docs/first-gladiator/preregistrations/m7-scrambled-history-gate.md
    notes: 'sampler_seeds carries the literal sentinel ''none-deterministic-temp0'': scripted deterministic
      runs consume no sampler seed. Preflight: scenario.lint_scramble_triplet must return [] before any
      run. Phase 2 (live model) is NOT authorized by this design.'
  purpose: 'Admission gate for the developmental-trajectory program: calibrates that the pipeline recovers
    a KNOWN order-sensitivity and its nulls. Blocks all downstream developmental claims until passed (COLISEUM-SCIENTIFIC-CHARTER.md
    paragraph 2).'
- experiment_id: m8-phase2-live-order-sensitivity
  status: pre-registered
  generalization_level: L2
  interaction_mode: sequential_history
  manifest: null
  design_hash: eb715c6599946f4ee16b2598f6ddad3093370c8356819fdd5f9a57da4cfac445
  planned_design:
    hypothesis: 'H0 for a live stochastic decider: the terminal final_action distribution of huihui_ai/qwen2.5-abliterate:7b-instruct
      is unchanged A vs B (identical admitted experience multiset, permuted presentation order); H1: it differs.
      C is the sham control (A''s order; agent-facing wording and formatting only). Unlike Phase 1, no answer is
      known in advance -- Phase 1 calibrated the instrument on scripted rules with pre-declared outcomes; Phase 2
      is a discovery experiment in which the null is a perfectly good outcome. A failed sham voids the order claim.'
    models:
    - huihui_ai/qwen2.5-abliterate:7b-instruct
    model_digests:
      huihui_ai/qwen2.5-abliterate:7b-instruct: 103482475c9b4d4032999dd5d7383478cad8b966ae6ae984d525daf7352c2219
    driver: ollama_local
    interaction_mode: sequential_history
    scenarios:
    - scramble_dev_m8
    - scramble_perm_m8
    - scramble_sham_m8
    scenario_seeds:
    - 42
    - 1
    sampler_seeds:
    - 2001
    - 2002
