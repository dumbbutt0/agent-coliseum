    max_surviving_delta: 2
    depends_on: m7-scrambled-history-gate
    primary_event: 'ANALYSIS IDENTITY (frozen): the Phase-2 analysis callable is metrics.order_sensitivity_report at
      ORDER_REPORT_VERSION 3, consuming the admissibility_policy and the thresholds frozen in THIS registry entry (bootstrap_iterations
      / bootstrap_seed / confidence / min_detectable_effect / permutation_iterations / permutation_seed / alpha / noise_floor_split)
      together with the frozen max_surviving_delta. The callable version is 3 because the DECISION RULE changed again:
      version 2 replaced the split-half noise floor with a PAIRED PERMUTATION null, and version 3 corrects the sensitivity
      requirement from a symmetric precondition gating BOTH branches to an asymmetric requirement attaching ONLY to
      the null branch -- so any emitted verdict stays traceable to the exact rule that produced it. NULL MODEL: for
      each of the 48 matched effective units (variant_id, scenario_seed, sampler_seed) present in every condition, the
      terminal actions of the two compared conditions are exchanged with probability one half, the total-variation distance
      is recomputed, and the procedure repeats for permutation_iterations under permutation_seed; the decision quantile
      is the 1 - alpha percentile of that null. Let q_AB and q_AC be the 1 - alpha quantiles of the paired permutation
      nulls for A vs B and for A vs C respectively. A percentile bootstrap (bootstrap_iterations under bootstrap_seed
      at confidence) is retained for REPORTING intervals on the observed distances only and decides nothing. The Phase-1
      terminal-distribution comparator is explicitly NOT the Phase-2 analysis path -- it is named only in notes, never
      here, so that no analysis identity can ever select it: it admits parse fallbacks as decisions, and on this very
      candidate it returned TV(A,B) = TV(A,C) = 0.0 with all mass on a single action from 12 runs of wholly unparseable
      output -- a clean null produced by an instrument that parsed nothing. Freezing it here would freeze the exact
      unsafe path Phase 2 exists to avoid. DECISION RULE (ORDERED; the FIRST clause that matches decides, and no later
      clause may revise it): (1) if the admissibility policy refuses, or the seed probe fails, or digest drift is detected,
      or effective n falls below min_admissible_effective_n, or the per-condition surviving counts differ by more than
      max_surviving_delta, the verdict is inconclusive; (2) else if the observed TV(A,C) exceeds q_AC the verdict is
      inconclusive -- the sham is not null, which voids any order claim outright and is never rescued post hoc; (3)
      else if the observed TV(A,B) exceeds q_AB the verdict is ORDER EFFECT OBSERVED; (4) else if q_AB is less than
      or equal to min_detectable_effect the verdict is NO ORDER EFFECT OBSERVED, and the bound that null claim is entitled
      to state is min_detectable_effect; (5) else the verdict is inconclusive. ASYMMETRY OF THE SENSITIVITY REQUIREMENT
      (deliberate): the requirement q_AB <= min_detectable_effect attaches ONLY to the null branch, clause (4), and
      never invalidates a rejection. q_AB IS the rejection threshold of this test, so a clause (3) outcome means H0
      was rejected at alpha, and that is a valid positive finding whether or not a smaller effect would also have been
      resolvable. Sensitivity constrains only what may be concluded from a NON-rejection, because a null claim asserts
      the absence of an effect at or above min_detectable_effect and is unsupportable unless the test could actually
      have resolved an effect of that size; a positive claim asserts only that this comparison rejected, and needs no
      such warrant. Reaching clause (3) therefore requires exactly two things and nothing more: that the observed TV(A,C)
      does NOT exceed q_AC, and that the observed TV(A,B) exceeds q_AB. The superseded symmetric formulation, which
      gated BOTH branches on min_detectable_effect, was measured perverse: at total separation over near-two-point support,
      TV(A,B) = 1.0 against q_AB = 0.2917 -- a decisive rejection -- was reported inconclusive solely because 0.2917
      > 0.25, discarding a maximal unambiguous effect. An inconclusive from clause (5) means the pack neither rejected
      H0 nor earned the right to assert absence: it is NOT evidence of absence and must never be reported as a null
      result. DIAGNOSTIC ONLY: noise_floor_split remains frozen and design-hashed and TV_null = TV(A|S1, A|S2) is still
      computed and still reported, but purely as a within-condition stability DIAGNOSTIC. It gates NO verdict, decides
      NO branch of this rule, and no future reader may treat it as decisive.'
    prereg_doc: docs/first-gladiator/preregistrations/m8-phase2-live-order-sensitivity.md
    notes: 'Live runs are NOT authorized by this pre-registration: executing any run of this design requires owner SC-6
      approval bound to the exact design hash, candidate commit, model digest, run count, and budget. A design AUDIT_GO
      is not permission to contact a provider. Prerequisite: the Phase 1 scripted calibration (m7-scrambled-history-gate,
      events 001714/001719/001724) must have PASSED before any Phase 2 run is scheduled. The model digest is part of
      the hashed regime: a digest change is a NEW regime whose runs NEVER pool with Phase 1 or with earlier Phase 2
      runs; this is an abliterated (refusal-suppressed) build and every claim is scoped to that regime. Phase 2 event
      points are EXPOSURE points (exactly one legal action), so the experience sequence is identical-except-order by
      construction and the terminal probe is the only free choice. The same 24 sampler seeds run in all three conditions
      so units pair across A/B/C. 1 model x 3 scenarios x 2 scenario_seeds x 24 sampler_seeds = 144 runs (48 effective
      units per condition). retries_per_unit 0: a failed unit is a typed outcome, never a re-roll. Conditions must be
      interleaved, not blocked. Preflight: scenario.lint_scramble_triplet must return [] before any run. NAMED ANALYSIS
      EXCLUSION: the Phase-1 comparator metrics.scramble_terminal_distribution may NOT be used to analyse this experiment;
      it is named here rather than in primary_event so that the analysis-identity lint can ban the symbol from primary_event
      outright instead of trying to parse an English negation. DROPOUT BOUND: max_surviving_delta = 2 is the absolute
      spread permitted between per-condition surviving counts -- approximately 5 percent of the 48 units per condition,
      matching max_non_decision_rate_delta, and deliberately the tighter mechanism in kind because a non-decision is
      counted and visible in the census whereas a dropped run is simply absent, and invisible loss warrants a stricter
      bound than visible loss. The Phase-2 execution and report path must load it from this frozen entry; a Phase-2
      pack must be unable to complete an analysis without it. AMENDMENT PROVENANCE: min_detectable_effect, max_surviving_delta
      and the analysis identity were added by the audit repair loop while this design was still an unfrozen candidate
      -- no outcome exists, no live run has occurred and no model has been contacted. The anti-rigging prohibition is
      on moving thresholds AFTER seeing outcomes; nothing here is weakened, two bounds are ADDED and the analysis path
      is narrowed to the safer one. NULL-MODEL REPLACEMENT (second audit repair, still pre-execution): the split-half
      noise floor was replaced by a PAIRED PERMUTATION null with permutation_iterations = 10000, permutation_seed =
      20260719 and alpha = 0.05. The design own required characterisation, run BEFORE any execution, measured the split-half
      rule INERT: TV_null between two 24-unit halves carries about twice the small-sample inflation of TV(A,B) computed
      on 48 against 48, placing the floor near 0.49 against a 0.25 ceiling, so the simulated false-positive rate was
      0.000 AND the power was 0.000. A design that cannot detect an effect of any size is not conservative, it is inert.
      The permutation null is exact under the exchangeability implied by H0, uses the actual matched sample sizes so
      no size mismatch remains, consumes no additional live runs, and respects the pairing the design already guarantees.
      The rejected alternative of raising min_detectable_effect above the noise floor would have "worked" while admitting
      only enormous effects -- precisely the reinterpret-to-rescue move this preregistration forbids. NOISE_FLOOR_SPLIT
      DEMOTION: noise_floor_split is RETAINED, still partitions the declared sampler_seeds, is still frozen and design-hashed
      and is still computed and reported -- but only as a DIAGNOSTIC of within-condition stability. It no longer gates
      any verdict and must never again be read as decisive. Legitimacy: no outcome exists, no live run has occurred
      and no model has been contacted; this preregistration itself REQUIRES that an underpowered design be corrected
      before execution rather than reinterpreted after. SENSITIVITY-ASYMMETRY CORRECTION (third audit repair, still
      pre-execution; ORDER_REPORT_VERSION bumped 2 -> 3): the sensitivity requirement q_AB <= min_detectable_effect
      had been specified as a precondition gating BOTH branches of the decision rule, carried over from the superseded
      split-half null without re-derivation. Under a split-half null an inflated floor genuinely broke both directions;
      under a paired permutation null it does not, because q_AB IS the rejection threshold, so exceeding it rejects
      H0 at alpha regardless of whether a smaller effect would also have been resolvable. Implemented symmetrically
      the rule was perverse: total separation with TV(A,B) = 1.0 against q_AB = 0.2917 returned inconclusive solely
      because 0.2917 > 0.25, discarding a decisive rejection. The requirement now attaches ONLY to the null branch and
      never invalidates a rejection. Nothing is weakened: the sham gate, the admissibility policy, the effective-n floor
      and max_surviving_delta all still gate every branch, and the null branch still carries the full sensitivity warrant.
      No outcome exists, no live run has occurred and no model has been contacted.'
  purpose: 'Phase 2 of the scrambled-history experiment: the LIVE-model counterpart of the Phase 1 scripted calibration
    gate. Does a real pinned model''s terminal action distribution change when an identical experience multiset
    is presented in a permuted order (A vs B), while the sham reorder control (A vs C) stays null?'
